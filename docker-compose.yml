version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: concyssa_mysql
    environment:
      MYSQL_DATABASE: db_concyssa
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql  # <--- Esto asegura la persistencia de los datos

  backend:
    build: .
    container_name: concyssa_backend
    ports:
      - "8081:8081"
    depends_on:
      - mysql-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/db_concyssa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

volumes:
  mysql_data:  # <--- Declaración del volumen persistente