spring.application.name=sistemaconcyssa
server.port=8081

# Conexi\u00f3n al nuevo servidor MySQL en puerto 3307
spring.datasource.url=jdbc:mysql://localhost:3307/db_concyssa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuraci\u00f3n de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad JWT
jwt.secret=ClaveSecretaSuperSeguraYExtremadamenteLargaParaCumplirConElStandardHS512DeJWT2026!
jwt.expiration=86400000
# Soporte de SpringDoc para Spring Data Pageable
springdoc.model-and-view-allowed=true
springdoc.override-with-generic-response=true



